<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PZKE · Maternity pants in Japanese organic cotton · Coming soon</title>
<meta name="description" content="PZKE makes maternity pants from 100% organic cotton knitted in Japan. Coming soon.">
<meta property="og:title" content="PZKE · Coming soon">
<meta property="og:description" content="Japanese fabric. Made for every month.">
<meta property="og:image" content="https://wearpzke.com/link-preview-1200x630.png">
<meta property="og:url" content="https://wearpzke.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--sumi:#2B2A28;--washi:#F5F5F2;--kinari:#E6DFD0;--nezumi:#8E8A84;--shu:#B4442E}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--washi);color:var(--sumi);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:100vh;min-height:100svh}
  .text{display:flex;flex-direction:column;justify-content:space-between;padding:48px clamp(24px,6vw,88px)}
  .top{display:flex;align-items:center}
  .top svg{width:118px;height:auto;display:block}
  .seal{width:56px!important}
  main{max-width:440px;padding:56px 0}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:clamp(26px,2.5vw,34px);letter-spacing:.14em;text-transform:uppercase;color:var(--shu);margin:0 0 18px;line-height:1.1}
  h1{font-family:"Shippori Mincho",serif;font-weight:400;font-size:clamp(18px,1.6vw,22px);line-height:1.5;margin:0;letter-spacing:.01em}
  footer{display:flex;flex-wrap:wrap;gap:8px 24px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--nezumi)}
  footer a{color:inherit;text-decoration:none}
  footer a:hover{color:var(--sumi)}
  .img{background:url(hero.jpg) 38% 50%/cover no-repeat var(--kinari)}
  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;grid-template-rows:auto 46vh}
    .img{grid-row:2;background-position:40% 50%}
    .text{padding:28px 20px 36px}
    main{padding:48px 0 40px}
    footer{order:3}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="text">
    <div class="top">
      <svg class="seal" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#B4442E" stroke-linecap="square" stroke-linejoin="miter"><rect x="4" y="4" width="112" height="112" stroke-width="4"/><g stroke-width="6"><path d="M24 51.6V18H37.2a8.4 8.4 0 0 1 0 16.8H24"/><path d="M73 18H94.6L73 51.6H94.6"/><path d="M24 68V101.6M44.4 68L24.6 86.6M31.2 80.6L45.6 101.6"/><path d="M94.4 68H74V101.6H94.4M74 84.8H90.8"/></g></g></svg>
    </div>

    <main>
      <p class="eyebrow">Coming soon</p>
      <h1>Japanese fabric.<br>Made for every month.</h1>
    </main>

    <footer>
      <a href="mailto:gal@wearpzke.com">gal@wearpzke.com</a>
      <span>© 2026 PZKE</span>
    </footer>
  </div>
  <div class="img" role="img" aria-label="A pregnant woman walking across a bamboo bridge by rice fields"></div>
</div>
</body>
</html>
